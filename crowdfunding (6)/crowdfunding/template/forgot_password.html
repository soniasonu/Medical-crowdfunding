<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CrowdFunding</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 30px; letter-spacing: 1px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; margin-bottom: 8px; color: rgba(255,255,255,0.7); }
        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        select option { background: #1e1b4b; }
        .btn-reset {
            width: 100%;
            padding: 14px;
            background: #00c6ff;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-reset:hover { background: #0099cc; }
        .back-link { text-align: center; margin-top: 20px; font-size: 13px; }
        .back-link a { color: rgba(255,255,255,0.5); text-decoration: none; }
    </style>
    <script>
        function updateHint() {
            var role = document.getElementById('role').selectedIndex;
            var hints = ["Verification (any)", "Enter Mobile Number", "Enter Phone Number", "Enter Age"];
            document.getElementById('verify_label').innerHTML = hints[role] || "Verification Detail";
        }
    </script>
</head>
<body>
    <div class="reset-card">
        <h2>Reset Password</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Select Role</label>
                <select name="role" id="role" onchange="updateHint()" required>
                    <option value="Admin">Admin</option>
                    <option value="Hospital">Hospital</option>
                    <option value="Donor">Donor</option>
                    <option value="Patient">Patient</option>
                </select>
            </div>
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" name="un" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label id="verify_label">Verification (any)</label>
                <input type="text" name="verify" placeholder="Enter verification detail" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_pass" placeholder="Enter new password" required>
            </div>
            <button type="submit" class="btn-reset">Reset Password</button>
            <div class="back-link">
                <a href="/login">← Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
