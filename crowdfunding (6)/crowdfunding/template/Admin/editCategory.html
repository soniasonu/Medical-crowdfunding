{% extends 'Admin/PageHeader.html' %}
{% block content %}
<head>
    <style>
        #cs {
            font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

            #cs td, #cs th {
                border: 1px solid #ddd;
                padding: 8px;
            }

            #cs tr:nth-child(even) {
                background-color: #f2f2f2;
            }

            #cs tr:hover {
                background-color: #ddd;
            }

            #cs th {
                padding-top: 12px;
                padding-bottom: 12px;
                text-align: left;
            }
    </style>
</head>
<h2>Edit</h2>
<form name="form1" method="post">
                  {% csrf_token %}
    <table id="cs">
            <input name="TxtNutritionId" type="hidden" value="{{ data.0 }}" readonly />
            <tr><th>Name</th><td><input name="TxtName" type="text" value="{{ request.session.d }}" pattern="^[a-zA-Z]+( [a-zA-Z]+)*$" required /></td></tr>
            <tr> <th>   </th><td><input type="submit" value="Update" /></td></tr>

    </table>
</form>
{% endblock %}
