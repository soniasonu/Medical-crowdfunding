{% extends 'Admin/PageHeader.html' %}
{% block content %}
<div class="wrapper row3" style="background: transparent;">
  <main class="hoc container clear"> 
    <div class="glass-container">
        <h2 style="color: #333; margin-bottom: 20px;">📋 Manage Categories</h2>
        <table class="premium-table">
            <thead>
                <tr>
                    <th style="width: 100px;">Sl.no</th>
                    <th>Category Name</th>
                    <th style="text-align: center; width: 220px;">Actions</th>
                </tr>
            </thead>
            <tbody>
            {% for row in data %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td style="font-weight: 500;">{{ row.1 }}</td>
                    <td style="text-align: center;">
                        <a href="/editCategory/{{ row.0 }}" class="btn-sm btn-edit">✏️ Edit</a>
                        <a href="/deleteCategory/{{ row.0 }}" class="btn-sm btn-delete" onclick="return confirm('Are you sure you want to delete this category?')">🗑️ Delete</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
  </main>
</div>

{% endblock %}
