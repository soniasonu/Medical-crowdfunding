{% extends "Admin/PageHeader.html" %}
{% block content %}

<div class="wrapper row3">
  <main class="hoc container clear">
    <div class="view-container">
        <h2>❤️ Registered Donors</h2>

        <table>
            <thead>
                <tr>
                    <th>Donor ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody>
                {% for i in data %}
                <tr>
                    <td><span style="background: #fdf2f8; color: #db2777; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 700;">#{{ i.0 }}</span></td>
                    <td><strong>{{ i.2 }}</strong></td>
                    <td>{{ i.3 }}</td>
                    <td>{{ i.1 }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" style="text-align: center; padding: 40px; color: #64748b; font-style: italic;">No donors registered yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
  </main>
</div>

{% endblock %}
