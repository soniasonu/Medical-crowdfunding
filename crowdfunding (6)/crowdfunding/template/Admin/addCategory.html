{% extends 'Admin/PageHeader.html' %}
{% block content %}
<div class="wrapper row3" style="background: transparent;">
  <main class="hoc container clear"> 
    <div class="view-container">
        <h2>Add Category</h2>
        <form id="form1" name="form1" method="post" action="">
            {% csrf_token %}
            <div style="margin-bottom: 25px;">
                <label for="TxtName" style="display: block; margin-bottom: 8px; font-weight: 600;">Category Name</label>
                <input type="text" id="TxtName" name="TxtName" placeholder="Enter new category name..." autofocus required>
            </div>
            <button type="submit">Register Category</button>
        </form>
    </div>
  </main>
</div>
{% endblock %}
