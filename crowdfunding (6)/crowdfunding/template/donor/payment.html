
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - Hospital Donation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #22c55e;
            --dark: #0f172a;
            --light: #f8fafc;
        }

        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .payment-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            background: var(--dark);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .card-body {
            padding: 2.5rem;
        }

        .amount-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 1rem;
            display: inline-block;
        }

        .form-label {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-pay {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            width: 100%;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 1.5rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-pay:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        .btn-pay:active {
            transform: translateY(0);
        }

        .card-type-icons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 2rem;
            color: #cbd5e1;
            font-size: 1.5rem;
        }

        .card-type-icons i.active {
            color: var(--dark);
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="payment-card">
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner mb-3"></div>
        <div class="fw-bold text-dark">Processing Donation...</div>
    </div>

    <div class="card-header">
        <h4 class="mb-0">Complete Donation</h4>
        <div class="amount-badge">₹{{ amount }}</div>
    </div>

    <div class="card-body">
        <div class="card-type-icons">
            <i class="fab fa-cc-visa active"></i>
            <i class="fab fa-cc-mastercard"></i>
            <i class="fab fa-cc-amex"></i>
            <i class="fab fa-cc-discover"></i>
        </div>

        <form action="/payment_success" method="POST" id="paymentForm">
            {% csrf_token %}
            <input type="hidden" name="patient_id" value="{{ patient_id }}">
            <input type="hidden" name="amount" value="{{ amount }}">

            <div class="mb-3">
                <label class="form-label">CARD HOLDER NAME</label>
                <input type="text" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="mb-3">
                <label class="form-label">CARD NUMBER</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fa fa-credit-card text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" placeholder="0000 0000 0000 0000" id="cardNumber" maxlength="19" required>
                </div>
            </div>

            <div class="row">
                <div class="col-7">
                    <div class="mb-3">
                        <label class="form-label">EXPIRY DATE</label>
                        <input type="text" class="form-control" placeholder="MM / YY" maxlength="5" required>
                    </div>
                </div>
                <div class="col-5">
                    <div class="mb-3">
                        <label class="form-label">CVV</label>
                        <input type="password" class="form-control" placeholder="***" maxlength="3" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-pay">
                <i class="fa fa-lock"></i> Pay ₹{{ amount }} Now
            </button>
            
            <p class="text-center mt-4 text-muted small">
                <i class="fa fa-shield-alt"></i> Your payment is secured with 256-bit encryption
            </p>
        </form>
    </div>
</div>

<script>
    document.getElementById('paymentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('loadingOverlay').style.display = 'flex';
        
        // Simulate a slight delay for processing
        setTimeout(() => {
            this.submit();
        }, 2000);
    });

    // Simple card number formatting
    document.getElementById('cardNumber').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        let formatted = value.match(/.{1,4}/g)?.join(' ') || '';
        e.target.value = formatted;
    });
</script>

</body>
</html>
