{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Nex-Gen Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}?v=1.5">
</head>
<body class="auth-body" style="background-color: #0f172a; background-image: linear-gradient(rgba(15,23,42,0.65), rgba(15,23,42,0.65)), url('{% static 'images/login_bg.png' %}'); background-size: cover; background-position: center;">
<div class="auth-card">
  <!-- Logo -->
  <div class="auth-logo">
    <div class="logo-icon"><i class="fas fa-tools"></i></div>
    <h1>Nex-Gen Service</h1>
    <p>Sign in to your account</p>
  </div>

  {% if messages %}
  <ul class="messages" style="margin-bottom:16px;">
    {% for message in messages %}
    <li class="message {{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  <!-- Role tabs -->
  <div class="role-tabs" style="margin-bottom:20px;" id="role-tabs">
    <button class="role-tab active" data-role="admin"  type="button"><i class="fas fa-user-shield"></i> Admin</button>
    <button class="role-tab"        data-role="agency" type="button"><i class="fas fa-building"></i> Agency</button>
    <button class="role-tab"        data-role="worker" type="button"><i class="fas fa-hard-hat"></i> Worker</button>
    <button class="role-tab"        data-role="user"   type="button"><i class="fas fa-user"></i> User</button>
  </div>

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="role" id="role-input" value="admin">
    <div class="form-group" style="margin-bottom:14px;">
      <label>Username / ID</label>
      <input type="text" name="username" id="username" required placeholder="Enter your ID" autocomplete="username">
    </div>
    <div class="form-group" style="margin-bottom:20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <label style="margin-bottom:0;">Password</label>
        <a href="{% url 'forgot_password' %}" style="font-size:0.85em; font-weight:500;">Forgot Password?</a>
      </div>
      <input type="password" name="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary w-full" style="justify-content:center;padding:12px;font-size:14px;">
      <i class="fas fa-sign-in-alt"></i> Sign In
    </button>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="{% url 'register_select' %}">Register here</a>
  </div>
</div>

<script>
  document.querySelectorAll('.role-tab').forEach(tab => {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      document.getElementById('role-input').value = this.dataset.role;
    });
  });
</script>
</body>
</html>
