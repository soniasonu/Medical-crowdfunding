{% extends "base_worker.html" %}
{% block title %}My Categories – Worker Dashboard{% endblock %}
{% block page_heading %}My Categories{% endblock %}

{% block content %}
<div class="card" style="margin-top:20px;">
  <div class="card-header">
    <h3><i class="fas fa-tags"></i> My Work Categories</h3>
  </div>
  <div class="tag-list">
    {% for c in categories %}
    <span class="tag"><i class="fas fa-wrench"></i> {{ c.name }}</span>
    {% empty %}
    <div class="td-empty">No work categories identified.</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
