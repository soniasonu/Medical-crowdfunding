{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – Nypunya Worker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body class="auth-body">
<div class="auth-card" style="max-width:440px;">
  <div class="auth-logo">
    <div class="logo-icon" style="background:linear-gradient(135deg,#f59e0b,#d97706);"><i class="fas fa-lock-open"></i></div>
    <h1>Account Recovery</h1>
    <p>Enter your registered email to reset your password</p>
  </div>

  {% if messages %}
  <ul class="messages" style="margin-bottom:16px;">
    {% for message in messages %}<li class="message {{ message.tags }}">{{ message }}</li>{% endfor %}
  </ul>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="form-group" style="margin-bottom:20px;">
      <label>Email Address</label>
      <input type="email" name="email" required placeholder="name@example.com" style="width:100%; padding:12px; border-radius:8px; border:1px solid #e2e8f0;">
    </div>
    
    <button type="submit" class="btn btn-primary w-full" style="justify-content:center; padding:12px; font-weight:600; background:#2563eb;">
      <i class="fas fa-search-location"></i> Find My Account
    </button>
  </form>

  <div class="auth-footer" style="margin-top:20px; text-align:center;">
    Suddenly remembered? <a href="{% url 'login' %}" style="color:#2563eb; font-weight:600;">Go to Login</a>
  </div>
</div>
</body>
</html>
