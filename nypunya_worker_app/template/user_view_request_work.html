{% extends "base_user.html" %}
{% block title %}Request Work – User Dashboard{% endblock %}
{% block page_heading %}<i class="fas fa-plus-circle"></i> Send Job Request{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h3>Request Service from Agency</h3>
  </div>
  <form method="post" action="{% url 'user_request_work' %}">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Select Agency</label>
        <select name="agency_id" required>
          <option value="">Choose an agency…</option>
          {% for a in agencies %}
          <option value="{{ a.agency_id }}">{{ a.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Category (Optional)</label>
        <select name="category_id">
          <option value="">Any category</option>
          {% for c in categories %}
          <option value="{{ c.category_id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group" style="margin-top:16px;">
      <label>Work Description</label>
      <textarea name="work_description" required placeholder="Describe the work needed in detail…" rows="4"></textarea>
    </div>
    <div style="margin-top:16px;">
      <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Send Request</button>
    </div>
  </form>
</div>
{% endblock %}
