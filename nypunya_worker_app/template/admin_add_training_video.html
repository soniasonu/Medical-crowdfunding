{% extends "base_admin.html" %}
{% block title %}Upload Video – Admin Dashboard{% endblock %}
{% block page_heading %}<i class="fas fa-upload"></i> Upload Training Video{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="card-header">
    <h3>Video Details</h3>
  </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
      <label>Video Title</label>
      <input type="text" name="title" placeholder="Enter video title" required class="form-control">
    </div>
    <div class="form-group" style="margin-top: 15px;">
      <label>Description</label>
      <textarea name="description" placeholder="Enter video description" rows="4" required class="form-control"></textarea>
    </div>
    <div class="form-group" style="margin-top: 15px;">
      <label>Video File</label>
      <input type="file" name="video_file" accept="video/*" required class="form-control">
    </div>
    <div class="form-group" style="margin-top: 20px;">
      <button type="submit" class="btn btn-primary w-100"><i class="fas fa-cloud-upload-alt"></i> Upload Video</button>
    </div>
  </form>
</div>
{% endblock %}
