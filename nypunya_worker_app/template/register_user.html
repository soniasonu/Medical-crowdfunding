{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register User – Nypunya Worker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body class="auth-body">
<div class="auth-card" style="max-width:500px;">
  <div class="auth-logo">
    <div class="logo-icon" style="background:linear-gradient(135deg,#2563eb,#1d4ed8);"><i class="fas fa-user"></i></div>
    <h1>Public User Registration</h1>
    <p>Create your account to request services</p>
  </div>
  {% if messages %}
  <ul class="messages" style="margin-bottom:16px;">
    {% for message in messages %}<li class="message {{ message.tags }}">{{ message }}</li>{% endfor %}
  </ul>
  {% endif %}
  <form method="post" action="{% url 'register_user' %}" enctype="multipart/form-data">
    {% csrf_token %}
    
    <!-- Profile Picture Section -->
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 100px; height: 100px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #94a3b8; border: 3px solid #e2e8f0; margin: 0 auto 12px; font-size: 32px;">
        <i class="fas fa-camera-retro"></i>
      </div>
      <label style="display: block; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 8px;">Your Profile Picture</label>
      <input type="file" name="user_image" accept="image/*" style="font-size: 12px; color: #94a3b8; padding: 6px; border: 1px dashed #cbd5e1; border-radius: 6px; cursor: pointer; width: 100%; max-width: 220px;">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>User ID</label>
      <input type="text" name="user_id" required placeholder="Choose a unique user ID">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>Full Name</label>
      <input type="text" name="name" required placeholder="Your full name">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>Address</label>
      <input type="text" name="address" placeholder="Your address">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>Email Address</label>
      <input type="email" name="email" required placeholder="Your email address">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>Phone</label>
      <input type="tel" name="phone" placeholder="10-digit phone" maxlength="10"
        pattern="[0-9]{10}" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)" required>
    </div>
    <div class="form-row" style="margin-bottom:20px;">
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Create a password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required placeholder="Repeat password">
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-full" style="justify-content:center;padding:12px;">
      <i class="fas fa-user-plus"></i> Create Account
    </button>
  </form>
  <div class="auth-footer">Already have an account? <a href="{% url 'login' %}">Sign in</a></div>
</div>
</body>
</html>
