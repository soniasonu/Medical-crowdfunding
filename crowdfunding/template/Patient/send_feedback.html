{% extends "Patient/PatientHeader.html" %}
{% block content %}
<div class="wrapper row3" style="background: transparent;">
  <main class="hoc container clear"> 
    <div class="view-container" style="max-width: 600px;">
        <h2 style="text-align: center; margin-bottom: 30px;">💬 Share Your Feedback</h2>
        
        <form action="/patient_send_feedback" method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #475569;">Title</label>
                <input type="text" name="title" placeholder="What is this regarding?" required 
                       style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px;">
            </div>
            
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #475569;">Your Message</label>
                <textarea name="description" rows="5" placeholder="Share your experience or request help..." required 
                          style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; resize: vertical;"></textarea>
            </div>
            
            <button type="submit" style="width: 100%; background: #0891b2; color: #fff; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s;">
                Submit Feedback
            </button>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="/patient_view_feedback" style="color: #0891b2; text-decoration: none; font-size: 14px; font-weight: 600;">View My Previous Feedback ➔</a>
            </div>
        </form>
    </div>
  </main>
</div>
{% endblock %}
