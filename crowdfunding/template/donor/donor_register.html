{% extends 'donor/DonorHomePage.html' %}
{% block content %}
<style>
    .registration-page {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
        min-height: calc(100vh - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }
    .reg-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 50px 40px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        color: #fff;
    }
    .reg-card h2 {
        text-align: center;
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
        background: linear-gradient(to right, #ec4899, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .reg-card p {
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
        margin-bottom: 35px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }
    .form-group input {
        width: 100%;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #fff;
        font-size: 15px;
        transition: all 0.3s ease;
    }
    .form-group input:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: #ec4899;
        box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.1);
        outline: none;
    }
    .btn-reg {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #ec4899, #d946ef);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 10px;
    }
    .btn-reg:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
    }
</style>

<div class="registration-page">
    <div class="reg-card">
        <h2>Donor Join</h2>
        <p>Save a life by becoming a donor today</p>
        
        <form method="post" action="">
            {% csrf_token %}
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required pattern="^[a-zA-Z]+( [a-zA-Z]+)*$" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" pattern="[6-9]{1}[0-9]{9}" required placeholder="91-XXXXXXXXXX">
            </div>
            <div class="form-group">
                <label>Email (Username)</label>
                <input type="email" name="email" required placeholder="yourname@example.com">
            </div>
            <div class="form-group">
                <label>Security Password</label>
                <input type="password" name="password" required placeholder="Create a strong password">
            </div>
            <button type="submit" class="btn-reg">Create Account ❤️</button>
        </form>
    </div>
</div>

{% endblock %}
