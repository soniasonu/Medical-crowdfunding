{% extends 'donor/pageheader.html' %}
{% block content %}
<head>
    <style>
        #cs {
            font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

            #cs td, #cs th {
                border: 1px solid #ddd;
                padding: 8px;
            }

            #cs tr:nth-child(even) {
                background-color: #f2f2f2;
            }

            #cs tr:hover {
                background-color: #ddd;
            }

            #cs th {
                padding-top: 12px;
                padding-bottom: 12px;
                text-align: left;
            }
    </style>
</head>








<div class="container mt-5">

<h2 class="text-center">Donate Amount</h2>

<form method="post" action="/donor_payment">

{% csrf_token %}

<input type="hidden" name="patient_id"
value="{{patient_id}}">

<div class="form-group">

<label>Enter Amount</label>

<input type="number"
name="amount"
class="form-control"
required>

</div>

<br>

<button class="btn btn-success">
Proceed Payment
</button>

</form>

</div>
{% endblock %}
