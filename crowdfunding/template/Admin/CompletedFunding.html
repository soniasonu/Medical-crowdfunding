{% extends 'Admin/PageHeader.html' %}
{% block content %}
<head>
        <style>
            #cs {
                font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
                border-collapse: collapse;
                width: 100%;
            }

                #cs td, #cs th {
                    border: 1px solid #ddd;
                    padding: 8px;
                }

                #cs tr:nth-child(even) {
                    background-color: #f2f2f2;
                }

                #cs tr:hover {
                    background-color: #ddd;
                }

                #cs th {
                    padding-top: 12px;
                    padding-bottom: 12px;
                    text-align: left;
                }
        </style>
    </head>
<p>&nbsp;</p>

    <h2>collected_amount Report</h2>
    <table id="cs">
        <tr>

            <th>idcollected_amount</th>
            <th>credited_date</th>
            <th>iduser_fund_request</th>
            <th>donated_user_id</th>
            <th>amount</th>

        </tr>
        {% for row in data %}

  <tr>
      <td height="87"><div align="center">{{ row.0 }}</div></td>
      <td><div align="center">{{ row.1 }}</div></td>
       <td><div align="center">{{ row.3 }}</div></td>
      <td><div align="center">{{ row.4 }}</div></td>
        {% endfor %}
    </table>
{% endblock %}
