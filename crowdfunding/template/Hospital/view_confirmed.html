{% extends 'Hospital/pageheader.html' %}
{% block content %}

<div class="wrapper row3">
  <main class="hoc container clear">
    <div class="view-container">
        <h2>Confirmed Requests</h2>

        <table>
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Aadhar Number</th>
                    <th>User Name</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td><strong>{{ row.1 }}</strong></td>
                    <td>{{ row.2 }}</td>
                    <td>{{ row.6 }}</td>
                    <td>{{ row.7 }}</td>
                    <td>{{ row.8 }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" style="text-align: center; padding: 30px; color: #64748b; font-style: italic;">No confirmed requests found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
  </main>
</div>

{% endblock %}
