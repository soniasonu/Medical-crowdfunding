{% extends 'Hospital/pageheader.html' %}
{% block content %}

<style>
.glass-container {
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 40px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    margin: 40px auto;
    max-width: 800px;
    color: #fff;
}

.glass-container h2 {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 30px;
    color: #fff;
    text-transform: uppercase;
}

.total-banner {
    background: linear-gradient(135deg, rgba(32,201,151,0.25), rgba(0,114,255,0.25));
    border: 1px solid rgba(32,201,151,0.4);
    border-radius: 12px;
    padding: 20px 30px;
    text-align: center;
    margin-bottom: 30px;
    font-size: 22px;
    font-weight: 700;
    color: #6ee7b7;
}

.premium-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    overflow: hidden;
}

.premium-table thead tr {
    background: linear-gradient(90deg, rgba(32,201,151,0.4), rgba(0,198,255,0.4));
}

.premium-table th {
    padding: 14px 18px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.premium-table td {
    padding: 13px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.85);
    font-size: 14px;
}

.premium-table tbody tr:hover {
    background: rgba(255,255,255,0.08);
    transition: background 0.25s;
}

.amount-badge {
    background: rgba(32,201,151,0.18);
    color: #6ee7b7;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
}

.btn-back {
    display: inline-block;
    margin-top: 20px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
}

.btn-back:hover {
    background: rgba(255,255,255,0.22);
    transform: translateX(-3px);
    color: #fff;
    text-decoration: none;
}

.empty-state {
    text-align: center;
    padding: 30px;
    color: rgba(255,255,255,0.5);
    font-style: italic;
}
</style>

<div class="wrapper row3">
  <main class="hoc container clear">
    <div class="glass-container">
        <h2>💰 Collected Amount — {{ patient.0 }}</h2>

        <div class="total-banner">
            Total Collected: ₹ {{ total }}
        </div>

        <table class="premium-table">
            <thead>
                <tr>
                    <th>Donor Name</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for d in data %}
                <tr>
                    <td>{{ d.0 }}</td>
                    <td><span class="amount-badge">₹ {{ d.1 }}</span></td>
                    <td>{{ d.2 }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="empty-state">No donations received yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="/view_patients" class="btn-back">← Back to Patients</a>
    </div>
  </main>
</div>

{% endblock %}
